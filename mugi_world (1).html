<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mugi World</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0b1020;color:#f8fafc;font-family:'Press Start 2P',ui-monospace,monospace;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

canvas{display:block;image-rendering:pixelated;width:800px;height:600px}

.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.82);z-index:20}
.ov.on{display:flex}
.box{background:#f8fafc;color:#0f172a;border:6px solid #334155;border-radius:8px;padding:18px;width:640px;max-height:560px;overflow:auto;box-shadow:4px 4px 0 #000;line-height:1.6;font-size:11px}
.box h1{font-size:22px;margin:8px 0;color:#dc2626}
.box small{color:#475569;font-size:9px;line-height:1.7}
.tc{text-align:center}
#logo{width:120px;height:125px;image-rendering:pixelated}
#ptitle{font-size:14px;color:#2563eb;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#pfoot{min-height:14px;margin-top:10px;font-size:10px;color:#16a34a;text-align:center}
.btn{font-family:inherit;font-size:11px;color:#fff;background:var(--c,#ef4444);border:3px solid rgba(0,0,0,.45);border-radius:4px;padding:8px;cursor:pointer;text-align:center;line-height:1.4}
.btn.sel{outline:4px solid #facc15;outline-offset:-1px}
.btn.off{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.btn.mv{padding:4px 6px;font-size:10px;line-height:1.4}.btn.mv small{display:block;font-size:8px;opacity:.95}
.chips i.g{background:#16a34a}.chips i.x{opacity:.35}
.btn.row{display:flex;gap:10px;align-items:center;text-align:left;background:#e2e8f0;color:#0f172a;border-color:#94a3b8;font-size:10px;position:relative}
.ic{width:44px;height:46px;image-rendering:pixelated;flex:none}
.mi{flex:1;min-width:0}.mn{font-size:11px;margin-bottom:5px}.mn small{color:#475569}
.chips{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap}
.chips i{font-style:normal;font-size:8px;padding:3px 5px;background:#475569;color:#fff;border-radius:3px}
.bar{height:10px;background:#cbd5e1;border:2px solid #0f172a;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#22c55e;transition:width .6s,background-color .3s}
.bar.xp{height:6px;border-width:1px;margin-top:5px}.bar.xp i{background:#3b82f6}
.lead{position:absolute;right:8px;top:8px;font-size:8px;background:#f59e0b;color:#000;padding:3px 5px;border-radius:3px}
#dlg{position:absolute;left:12px;right:12px;bottom:12px;height:120px;background:#f8fafc;color:#0f172a;border:6px solid #334155;border-radius:8px;padding:16px;font-size:14px;line-height:1.75;display:none;box-shadow:4px 4px 0 rgba(0,0,0,.5);z-index:10}
#dlg.on{display:block}#dlg.narrow{right:340px}
#dlg.more::after{content:'▼';position:absolute;right:14px;bottom:8px;font-size:11px;animation:bl .8s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#menu{position:absolute;right:12px;bottom:12px;width:324px;height:120px;background:#f8fafc;border:6px solid #334155;border-radius:8px;padding:8px;display:none;z-index:11}
#menu.on{display:grid}
.hb{position:absolute;display:none;background:#f8fafc;color:#0f172a;border:4px solid #1e293b;border-radius:8px;padding:10px 12px;width:310px;font-size:11px;box-shadow:4px 4px 0 rgba(0,0,0,.45);z-index:5}
.hb.on{display:block}
.hb .r{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:7px}
.hb .r span{font-size:10px;color:#475569}
.hb .t{text-align:right;font-size:9px;margin-top:5px}
#ebox{left:28px;top:28px}#pbox{right:28px;top:338px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
#touch{display:none;position:absolute;inset:auto 0 0 0;height:210px;z-index:8;pointer-events:none}
#touch button{pointer-events:auto;position:absolute;width:62px;height:62px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(15,23,42,.55);color:#fff;font:inherit;font-size:16px}
@media (pointer:coarse){body.mapmode #touch{display:block}}
</style>
</head>

<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>

  <div id="ebox" class="hb"><div class="r"><b id="en"></b><span id="el"></span></div><div class="bar"><i id="eh"></i></div><div class="t" id="et"></div></div>
  <div id="pbox" class="hb"><div class="r"><b id="pn"></b><span id="pl"></span></div><div class="bar"><i id="ph"></i></div><div class="t" id="pt"></div><div class="bar xp"><i id="px"></i></div></div>

  <div id="dlg"></div>
  <div id="menu" class="grid"></div>

  <div id="title" class="ov on"><div class="box tc">
    <img id="logo" alt="Red">
    <h1>MUGI WORLD</h1>
    <p>Um universo de aventuras na grama alta. Capture Mugis selvagens com suas <b style="color:#dc2626">Mugibolas</b>, treine e evolua!</p>
    <div id="tb" class="grid" style="margin:14px 0"></div>
    <small>WASD / Setas: mover · Shift: correr · Enter / Z: confirmar · E: equipe · M: som</small>
  </div></div>

  <div id="panel" class="ov"><div class="box"><div id="ptitle"></div><div id="plist" class="grid"></div><div id="pfoot"></div></div></div>

  <div id="touch">
    <button data-k="u" style="left:70px;bottom:118px">▲</button><button data-k="l" style="left:8px;bottom:62px">◀</button>
    <button data-k="r" style="left:132px;bottom:62px">▶</button><button data-k="d" style="left:70px;bottom:6px">▼</button>
    <button id="bA" style="right:12px;bottom:62px">A</button><button id="bE" style="right:84px;bottom:20px">E</button>
  </div>
  <div id="fade"></div>
</div>

  for(let i=1;i<=text.length&&!skip;i++){dlg.textContent=text.slice(0,i);await sleep(16)}

  if(wait){dlg.classList.add('more');await new Promise(r=>confirmCb=r);dlg.classList.remove('more')}
  else{const t0=performance.now();while(performance.now()-t0<ms&&!skip)await sleep(30)}}

function choose(opts,{cols=2,back=true,host=$('menu')}={}){return new Promise(res=>{
  const isMenu=host.id==='menu';host.innerHTML='';host.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  if(isMenu){host.classList.add('on');dlg.classList.add('narrow')}
  let sel=Math.max(0,opts.findIndex(o=>!o.off));
  const bs=opts.map((o,i)=>{const b=document.createElement('button');b.className='btn'+(o.row?' row':'')+(o.cls?' '+o.cls:'')+(o.off?' off':'');b.innerHTML=o.t;if(o.c)b.style.setProperty('--c',o.c);
    b.onclick=()=>pick(i);b.onmouseenter=()=>{sel=i;paint()};host.appendChild(b);return b});
  const paint=()=>{bs.forEach((b,i)=>b.classList.toggle('sel',i===sel));bs[sel]&&bs[sel].scrollIntoView({block:'nearest'})};
  const done=v=>{menu=null;if(isMenu){host.classList.remove('on');dlg.classList.remove('narrow')}res(v)};
  const pick=i=>{if(opts[i].off){sfx('no');return}sfx('ok');done(i)};
  const mv=n=>{const j=sel+n;if(j>=0&&j<opts.length){sel=j;paint()}};
  menu={key(e){const c=e.code;
    if(c==='ArrowRight'||c==='KeyD')mv(1);else if(c==='ArrowLeft'||c==='KeyA')mv(-1);else if(c==='ArrowDown'||c==='KeyS')mv(cols);else if(c==='ArrowUp'||c==='KeyW')mv(-cols);
    else if(CONF.includes(c))pick(sel);else if(back&&['Escape','KeyX','Backspace','KeyE'].includes(c))done(-1)}};
  paint()})}

function tryMove(){const k=stack[stack.length-1];if(!k)return;P.dir=k;const[dx,dy]=D[k],nx=P.tx+dx,ny=P.ty+dy;

function updateMap(dt){
  if(P.moving){P.prog+=dt*(run?8.5:5);if(P.prog>=1){P.prog-=1;P.tx=P.nx;P.ty=P.ny;P.moving=false;P.steps++;arrive();if(state!=='map')return}}

  else if(t===1){if(++gs>3&&Math.random()<.13){gs=0;encounter()}}else gs=0;

function drawMap(){
  const prog=P.moving?P.prog:0,px=(P.tx+D[P.dir][0]*prog*(P.moving?1:0))*T,py=(P.ty+D[P.dir][1]*prog*(P.moving?1:0))*T;
  camX=Math.round(clamp(px+T/2-W/2,0,MW*T-W));camY=Math.round(clamp(py+T/2-H/2,0,MH*T-H));
  ctx.drawImage(mapLayer,camX,camY,W,H,0,0,W,H);
  const pp=gt(23,SPAWN.y)===6?.2+.18*Math.sin(now/250):0;ctx.fillStyle=`rgba(255,255,255,${pp})`;ctx.fillRect(23*T+9-camX,SPAWN.y*T+9-camY,22,22);
  const fr=P.moving?(prog<.66?(P.steps%2?1:2):0):0,sx=Math.round(px-camX),sy=Math.round(py-camY);
  const ents=NPCS.map(n=>({y:n.y*T,n})).concat([{y:py,p:1}]).sort((a,b)=>a.y-b.y);
  for(const en of ents){let ex,ey,spr;
    if(en.p){ex=sx;ey=sy;spr=trainerSprite(P.dir,fr,0)}else{const n=en.n;ex=n.x*T-camX;ey=n.y*T-camY;if(ex<-40||ex>W||ey<-60||ey>H)continue;spr=trainerSprite(n.dir,0,n.pi)}
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(ex+20,ey+36,13,5,0,0,7);ctx.fill();ctx.drawImage(spr,ex+2,ey-6,36,44);
    if(en.n&&en.n.alert){ctx.fillStyle='#ef4444';ctx.fillRect(ex+12,ey-38,16,22);ctx.fillStyle='#fff';ctx.font='14px "Press Start 2P",monospace';ctx.fillText('!',ex+16,ey-21)}}
  const gx=prog>.5?P.nx:P.tx,gy=prog>.5?P.ny:P.ty;
  if(gt(gx,gy)===1)ctx.drawImage(mapLayer,gx*T,gy*T+18,T,T-18,gx*T-camX,gy*T+18-camY,T,T-18);
  ctx.fillStyle='rgba(15,23,42,.72)';ctx.fillRect(8,8,330,32);ctx.drawImage(ballC,14,12,24,24);ctx.fillStyle='#fff';ctx.font='12px "Press Start 2P",monospace';ctx.fillText('x'+P.balls,46,31);ctx.fillStyle='#fde047';ctx.fillText('$'+P.money,110,31);ctx.drawImage(candyC,215,12,24,24);ctx.fillStyle='#f9a8d4';ctx.fillText('x'+P.candy,246,31);
}

function hud(){if(!B)return;const side=(p,m)=>{const s=stats(m),pc=m.hp/s.hp*100;$(p+'n').textContent=nm(m).toUpperCase();$(p+'l').textContent='Nv '+m.lvl;$(p+'h').style.width=pc+'%';$(p+'h').style.background=hpCol(pc);$(p+'t').textContent=m.hp+' / '+s.hp};

async function pickMugi(forced){$('panel').classList.add('on');$('ptitle').textContent=forced?'Envie outro Mugi!':'Trocar de Mugi';$('pfoot').textContent='';

async function encounter(tr){

  B={a:lead,e,tr:tr||null,ti:0,an:{p:{x:-320,y:0,a:1,s:1,f:0},e:{x:320,y:0,a:1,s:1,f:0},ball:null}};

async function endBattle(r){

  if(r==='lose'){healAll();P.tx=SPAWN.x;P.ty=SPAWN.y;P.dir='d';P.moving=false;P.prog=0}
  $('ebox').classList.remove('on');$('pbox').classList.remove('on');hideDlg();B=null;P.moving=false;P.prog=0;save();S('map');await fade(0)}

    if(i===0){const mvs=SP[B.a.sp].mv,a=stats(B.a),d=stats(B.e);ask('Golpe mais forte = menos preciso.');

async function attack(att,def,mv,side){const an=B.an,o=side==='p'?'e':'p',dir=side==='p'?1:-1;
  await say(`${nm(att)}${side==='e'&&!B.tr?' selvagem':''} usou ${mv.n}!`,{ms:250});
  if(mv.heal){const mx=stats(att).hp;att.hp=Math.min(mx,att.hp+Math.round(mx*mv.heal));sfx('heal');hud();await say(`${nm(att)} recuperou HP!`,{ms:500});return}
  if(Math.random()*100>mv.acc){await say('Mas errou!',{ms:400});return}
  await anim(240,t=>{an[side].x=Math.sin(t*Math.PI)*80*dir;an[side].y=-Math.sin(t*Math.PI)*30*dir});
  const a=stats(att),d=stats(def),crit=Math.random()<1/12;
  const dmg=Math.max(1,Math.round(mv.p*4*(a.atk/d.def)*rnd(.85,1.15)*(crit?1.6:1)));
  sfx(crit?'crit':'hit');await anim(320,t=>{an[o].f=Math.floor(t*6)%2});an[o].f=0;
  def.hp=Math.max(0,def.hp-dmg);hud();
  if(crit)await say('Acerto crítico!',{ms:400});
  if(mv.recoil&&def.hp>0){att.hp=Math.max(1,att.hp-Math.round(dmg*mv.recoil));hud();await say(`${nm(att)} sofreu com o impacto!`,{ms:400})}}

async function gainXP(m,amt){m.xp+=amt;
  while(m.xp>=need(m.lvl)){m.xp-=need(m.lvl);const old=stats(m).hp;m.lvl++;m.hp+=stats(m).hp-old;hud();sfx('lvl');await say(`${nm(m)} subiu para o Nv ${m.lvl}!`,{ms:700})}hud()}

async function checkFaint(){const an=B.an;
  if(B.e.hp<=0){await anim(600,t=>{an.e.y=t*50;an.e.a=1-t});
    await say(`${nm(B.e)}${B.tr?'':' selvagem'} foi derrotado!`,{ms:400});
    const xp=Math.round(B.e.lvl*38*RAR[SP[B.e.sp].rar].xp*(B.e.mut==='Boss'?2:1)*(B.tr?1.5:1));
    await say(`${nm(B.a)} ganhou ${xp} XP!`,{ms:400});await gainXP(B.a,xp);
    if(B.tr&&B.ti<B.tr.team.length-1){B.ti++;B.e=mk(...B.tr.team[B.ti]);seen(B.e);an.e.x=0;an.e.y=0;an.e.s=1;an.e.a=0;hud();
      await say(`${B.tr.n} enviou ${nm(B.e)} Nv ${B.e.lvl}!`,{ms:400});await anim(300,t=>an.e.a=t);return'swapped'}
    if(B.tr){const first=!P.won[B.tr.id],g=Math.round(B.tr.pay*(first?1:.5));P.won[B.tr.id]=1;await say(B.tr.lose,{wait:true});P.money+=g;await say(`Você ganhou $${g}!${first?'':' (revanche: metade do prêmio)'}`,{ms:900})}
    else if((P.q.wild++,Math.random()<.3)){const n=ri(1,2);P.balls+=n;await say(`Você encontrou ${n} Mugibola${n>1?'s':''}!`,{ms:500})}
    return'win'}
  if(B.a.hp<=0){await anim(600,t=>{an.p.y=t*60;an.p.a=1-t});await say(`${nm(B.a)} desmaiou!`,{ms:500});
    if(!P.party.some(m=>m.hp>0))return'lose';
    const i=await pickMugi(true);B.a=P.party[i];an.p.y=0;an.p.x=0;hud();await say(`Vai, ${nm(B.a)}!`,{ms:300});await anim(300,t=>an.p.a=t);return'swapped'}
  return null}

async function enemyAct(){const e=B.e;

async function throwBall(kind){const an=B.an,e=B.e;
  if(kind==='grand')P.grand--;else P.balls--;await say(kind==='grand'?'Você lançou uma Grandball!':'Você lançou uma Mugibola!',{ms:150});sfx('throw');
  const b=an.ball={x:240,y:380,rot:0,kind};
  await anim(650,t=>{b.x=240+350*t;b.y=380-130*t-Math.sin(t*Math.PI)*150;b.rot=t*12});
  await anim(300,t=>{an.e.s=1-.8*t;an.e.a=1-t});
  await anim(450,t=>{b.y=250+(t<.6?40*t/.6:40-Math.sin((t-.6)/.4*Math.PI)*12)});
  const st=stats(e),hpP=e.hp/st.hp,p=clamp((kind==='grand'?Math.sqrt(RAR[SP[e.sp].rar].catch)*1.5:RAR[SP[e.sp].rar].catch)*MUT[e.mut][7]*(.18+.62*(1-hpP)),.02,.97);
  const ok=Math.random()<p,shakes=ok?3:ri(0,2);
  for(let i=0;i<shakes;i++){await sleep(250);sfx('shake');await anim(450,t=>b.rot=Math.sin(t*Math.PI*2)*.5)}
  await sleep(300);
  if(ok){sfx('catch');await say(`Capturado! ${nm(e)} agora é seu!`,{wait:true});
    e.xp=0;{P.q.caught++;if(e.mut!=='Normal')P.q.mut++;const q=dexE(e.sp);q.c++;if(!q.m.includes(e.mut))q.m.push(e.mut)}if(P.party.length<6)P.party.push(e);else{P.box.push(e);await say('Sua equipe está cheia. O Mugi foi para a caixa.',{ms:600})}
    an.ball=null;return'caught'}
  an.ball=null;await anim(300,t=>{an.e.s=.2+.8*t;an.e.a=t});
  await say(['Oh não! O Mugi escapou!','Quase! Estava tão perto!','Ah! Ele se soltou!'][shakes],{ms:500});return null}

async function battleLoop(){const an=B.an;
  while(true){
    const act=await pickAction();let r=null;
    if(act.k==='swap'){await say(`${nm(B.a)}, volte!`,{ms:200});await anim(250,t=>an.p.a=1-t);B.a=P.party[act.i];hud();await say(`Vai, ${nm(B.a)}!`,{ms:250});await anim(300,t=>an.p.a=t);r=await enemyAct()}
    else if(act.k==='ball'){r=await throwBall(act.kind);if(r==='caught')return'caught';if(!r)r=await enemyAct()}
    else if(act.k==='run'){const sp=stats(B.a).spd,se=stats(B.e).spd;
      if(Math.random()<clamp(.55+(sp-se)/se*.5,.25,.95)){await say('Você fugiu em segurança!',{ms:500});return'ran'}
      await say('Não conseguiu fugir!',{ms:500});r=await enemyAct()}
    else{const pm=act.mv,em=eMove(B.e);
      const sp=stats(B.a).spd,se=stats(B.e).spd,pf=pm.prio!==em.prio?pm.prio>em.prio:sp>=se;
      for(const side of pf?['p','e']:['e','p']){
        if(side==='p')await attack(B.a,B.e,pm,'p');
        else if(B.e.mut==='Hipnotizado'&&Math.random()<.3)await say(`${nm(B.e)} está hipnotizado e não se mexeu!`,{ms:600});
        else await attack(B.e,B.a,em,'e');
        r=await checkFaint();if(r)break}}
    if(r==='win'||r==='lose')return r}}

let bgC;
function bakeBG(){bgC=document.createElement('canvas');bgC.width=W;bgC.height=H;const g=bgC.getContext('2d');
  let s=g.createLinearGradient(0,0,0,320);s.addColorStop(0,'#7cc8f5');s.addColorStop(1,'#e6f6ff');g.fillStyle=s;g.fillRect(0,0,W,320);
  g.fillStyle='#8fcf6e';[[100,330,260,70],[420,335,300,80],[740,330,240,60]].forEach(([x,y,rx,ry])=>{g.beginPath();g.ellipse(x,y,rx,ry,0,Math.PI,0);g.fill()});
  s=g.createLinearGradient(0,300,0,H);s.addColorStop(0,'#7fcf5b');s.addColorStop(1,'#4f9a3a');g.fillStyle=s;g.fillRect(0,300,W,300);
  g.fillStyle='rgba(255,255,255,.1)';for(let y=320;y<H;y+=36)g.fillRect(0,y,W,10)}
function drawSide(a,m,back,bx,by,sc){if(a.a<=0.01)return;const spr=mugiSprite(m.sp,m.mut,back),s=sc*a.s,bob=Math.sin(now/260+(back?1:0))*2;
  if(a.f)return;ctx.save();ctx.globalAlpha=clamp(a.a,0,1);ctx.drawImage(spr,Math.round(bx+a.x-25*s),Math.round(by+a.y+bob-47*s),Math.round(50*s),Math.round(52*s));ctx.restore()}
function drawBall(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.drawImage(b.kind==='grand'?grandC:ballC,-16,-16,32,32);ctx.restore()}
function drawBattle(){if(!B)return;ctx.drawImage(bgC,0,0);
  ctx.fillStyle='rgba(40,90,30,.45)';ctx.beginPath();ctx.ellipse(590,300,140,28,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(210,452,170,34,0,0,7);ctx.fill();
  drawSide(B.an.e,B.e,false,590,300,3.2);drawSide(B.an.p,B.a,true,210,452,4.2);if(B.an.ball)drawBall(B.an.ball)}

function drawTrans(t){if(t<.3){if(Math.floor(t/.075)%2){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(0,0,W,H)}return}
  const k=(t-.3)/.7;ctx.fillStyle='#000';for(let i=0;i<15;i++){const w=clamp(W*k*1.5-i*14,0,W);i%2?ctx.fillRect(0,i*40,w,40):ctx.fillRect(W-w,i*40,w,40)}}

/* ============ MENU DE EQUIPE (tecla E) ============ */
async function openMenu(){S('menu');sfx('ok');$('panel').classList.add('on');
  while(true){
    $('ptitle').innerHTML=`<span>Meus Mugis</span><small>$${P.money} · Doces ${P.candy} · Caixa ${P.box.length} · Passos ${P.steps}</small>`;
    const opts=P.party.map((m,i)=>({t:row(m)+(i===0?'<b class="lead">LÍDER</b>':''),row:1})).concat([{t:'Mochila',c:'#d97706'},{t:'Mugidex',c:'#2563eb'},{t:'Salvar jogo',c:'#16a34a'},{t:'Fechar [E]',c:'#64748b'}]);
    const i=await choose(opts,{cols:1,host:$('plist'),back:true});
    if(i<0||i===opts.length-1)break;
    if(i===opts.length-4){await openBag();continue}
    if(i===opts.length-3){await openDex();continue}
    if(i===opts.length-2){save();$('pfoot').textContent='Jogo salvo!';continue}
    if(i>0){[P.party[0],P.party[i]]=[P.party[i],P.party[0]];$('pfoot').textContent=nm(P.party[0])+' agora lidera a equipe.'}}
  $('panel').classList.remove('on');$('pfoot').textContent='';S('map')}

/* ============ ENTRADA ============ */
async function openDex(){
  while(true){const ks=Object.keys(SP);
    $('ptitle').innerHTML=`<span>Mugidex</span><small>Vistos ${ks.filter(k=>dexE(k).s).length}/${ks.length} · Capturados ${ks.filter(k=>dexE(k).c).length}</small>`;
    const opts=ks.map((k,i)=>{const s=SP[k],d=dexE(k);return{row:1,t:`<img class="ic" alt="" src="${icon(k,'Normal')}" style="${d.s?'':'filter:brightness(0) opacity(.55)'}"><div class="mi"><div class="mn">Nº ${String(i+1).padStart(3,'0')} ${d.s?s.n:'???'} ${d.c?'<small>capturado</small>':''}</div>${d.s?`<div class="chips"><i style="background:${RAR[s.rar].cor}">${s.rar}</i><i>${s.tipo}</i><i>${s.classe}</i></div>`:'<small>Ainda não encontrado</small>'}</div>`}}).concat([{t:'Voltar',c:'#64748b'}]);
    const i=await choose(opts,{cols:1,host:$('plist'),back:true});
    if(i<0||i===ks.length)return;
    const k=ks[i],s=SP[k],d=dexE(k);if(!d.s){sfx('no');continue}
    const muts=Object.keys(MUT).map(m=>`<i class="${d.m.includes(m)?'g':'x'}">${m}</i>`).join(''),mvs=s.mv.map(n=>`${n}: poder ${MV[n].p}, precisão ${MV[n].acc}%`).join('<br>');
    await choose([{row:1,t:`<img class="ic" alt="" style="width:88px;height:92px" src="${icon(k,'Normal')}"><div class="mi"><div class="mn">${s.n}</div><div class="chips"><i style="background:${RAR[s.rar].cor}">${s.rar}</i><i>${s.tipo}</i><i>${s.classe}</i></div><small>HP ${s.base.hp} · ATQ ${s.base.atk} · DEF ${s.base.def} · VEL ${s.base.spd}</small><p style="font-size:9px;margin:8px 0">${mvs}</p><p style="font-size:9px;margin:8px 0;color:#475569">${LORE[k]}</p><small>Mutações capturadas: ${d.m.length}/${Object.keys(MUT).length}</small><div class="chips" style="margin-top:5px">${muts}</div></div>`}],{cols:1,host:$('plist'),back:true})}}
const KM={KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
addEventListener('keydown',e=>{
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(menu){menu.key(e);return}if(e.repeat)return;run=e.shiftKey;
  if(KM[e.code])press(KM[e.code]);
  else if(CONF.includes(e.code))confirmPress();
  else if(e.code==='KeyE'&&state==='map')openMenu();
  else if(e.code==='KeyM'){muted=!muted}});
addEventListener('keyup',e=>{run=e.shiftKey;if(KM[e.code])release(KM[e.code])});
addEventListener('blur',()=>{stack=[];run=false});
dlg.addEventListener('pointerdown',confirmPress);
document.querySelectorAll('#touch [data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();press(k)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>release(k)))});
$('bA').addEventListener('pointerdown',confirmPress);$('bE').addEventListener('pointerdown',()=>{if(state==='map')openMenu()});
function fit(){$('wrap').style.transform=`scale(${Math.min(innerWidth/W,innerHeight/H)})`}
addEventListener('resize',fit);fit();

/* ============ LOOP PRINCIPAL (único) ============ */
function loop(ts){requestAnimationFrame(loop);now=ts;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='battle')drawBattle();
  else{if(state==='map')updateMap(dt);drawMap();if(state==='trans')drawTrans(transT)}}

/* ============ INÍCIO ============ */
async function boot(){
  bake();bakeBG();$('logo').src=icon('red','Normal');P=newGame();
  const sv=load(),opts=(sv?[{t:'Continuar',c:'#16a34a'}]:[]).concat([{t:'Novo Jogo',c:'#ef4444'}]);
  requestAnimationFrame(loop);
  const i=await choose(opts,{cols:1,back:false,host:$('tb')});
  $('title').classList.remove('on');if(sv&&i===0)P=sv;P.party.concat(P.box).forEach(m=>{const q=dexE(m.sp);q.s=1;q.c=Math.max(q.c,1);if(!q.m.includes(m.mut))q.m.push(m.mut)});
  if(sv&&i===0){P=sv;S('map');await talk(['Bem-vindo de volta, treinador!'])}
  else{S('dialog');save();
    await talk(['Bem-vindo ao mundo dos Mugis!','Aqui vivem criaturas incríveis, nascidas da imaginação de duas crianças.','Você recebeu 5 Mugibolas e seu parceiro Red. Explore a grama alta e capture novos Mugis!','Dica: a Barraca de Cura é grátis, a Vovó Docinha troca pedidos por doces e a loja vende Mugibolas. Aperte E para abrir o menu.'])}}
boot();
</script>
